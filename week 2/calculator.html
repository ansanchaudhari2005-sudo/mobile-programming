<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result</title>
</head>
<body>

    <h2>Student Result</h2>

    <form onsubmit="result(event)">

        <label>English</label>
        <input type="number" id="english" min="0" max="100" placeholder="Enter marks" required><br><br>

        <label>Nepali</label>
        <input type="number" id="nepali" min="0" max="100" placeholder="Enter marks" required><br><br>

        <label>Chemistry</label>
        <input type="number" id="chemistry" min="0" max="100" placeholder="Enter marks" required><br><br>

        <label>Computer</label>
        <input type="number" id="computer" min="0" max="100" placeholder="Enter marks" required><br><br>

        <label>Optional Math</label>
        <input type="number" id="optionalMath" min="0" max="100" placeholder="Enter marks" required><br><br>

        <label>Maths</label>
        <input type="number" id="maths" min="0" max="100" placeholder="Enter marks" required><br><br>

        <label>Physics</label>
        <input type="number" id="physics" min="0" max="100" placeholder="Enter marks" required><br><br>

        <label>Social</label>
        <input type="number" id="social" min="0" max="100" placeholder="Enter marks" required><br><br>

        <button type="submit">Result</button>

    </form>

    <p id="result"></p>
    <p id="total"></p>

    <script src="calculatorjs.js"></script>

</body>
</html>
